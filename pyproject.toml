[project]
name = "solarix"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# textos longos de relatório/mensagens de anomalia não são quebrados de propósito
[tool.ruff.lint.per-file-ignores]
"src/solarix/checks.py" = ["E501"]
"src/solarix/reports/*.py" = ["E501"]
